[package]
name = "test-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Standalone workspace: this crate is only pulled in as a dev-dependency.
[workspace]

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1"
fs2 = "0.4.3"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
ureq = "3.5"
xz2 = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "forbid"
