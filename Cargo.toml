[workspace]
resolver = "2"

members = [
    "codegen",
    "common",
    "gpu",
    "headers",
    "icd",
    "runtime",
    "shader",
    "test_suite",
    "xtask",
]
# Keep HTTP/archive dependencies out of ordinary builds.
exclude = ["test_tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0"
log = "0.4.34"
env_logger = "0.11"
parking_lot = "0.12"
xcb = "1.7"
itertools = "0.15"
rustversion = "1.0"
assert_fs = "1.1"
anyhow = "1.0"
bytemuck = "1.25"
hashbrown = "0.17"

[workspace.lints.rust]
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wait_for_debugger)'] }

[workspace.lints.clippy]
unwrap_used = "forbid"
nursery = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
cognitive_complexity = "allow"
missing_safety_doc = "allow"
